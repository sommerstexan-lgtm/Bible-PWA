<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NASB Study">
  <meta name="description" content="Private Bible study app for NASB 1995. Personal data stays on your device only.">
  <title>NASB Study (Private)</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" role="application" aria-label="NASB Study Application">
    <p id="boot-msg" style="padding:2rem;text-align:center;color:#aaa">Loading…</p>
  </div>
  <script type="module" src="app.js"></script>
  <script>
    window.addEventListener('error', function (e) {
      if (e.filename && e.filename.indexOf('app.js') !== -1) {
        var app = document.getElementById('app');
        if (app) {
          app.innerHTML = '<div style="padding:2rem;max-width:420px;margin:2rem auto;color:#e8e8e8;background:#16213e;border-radius:12px;line-height:1.6">' +
            '<h2 style="color:#e57373">Could not load app.js</h2>' +
            '<p>Make sure all 12 files are uploaded to the repo root, then hard-refresh.</p></div>';
        }
      }
    }, true);
  </script>
</body>
</html>
